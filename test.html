<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Word 模版填充 - 本地修复版</title>
  <!-- 使用更稳定的 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 30px;
      background: #f4f4f4;
      max-width: 800px;
      margin: 0 auto;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h3 {
      margin-top: 0;
      color: #333;
    }

    button {
      background: #67C23A;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #85ce61;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      padding: 10px;
      border: 1px solid #ddd;
    }

    .status-bar {
      padding: 10px;
      background: #e8f3ff;
      color: #409EFF;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 14px;
    }

    .error-bar {
      background: #fde2e2;
      color: #f56c6c;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="box">
      <h3>1. 上传 ready_template.docx (必须本地打开此网页)</h3>
      <!-- 添加 onclick 用于调试点击是否生效 -->
      <input type="file" @change="handleFile" onclick="console.log('点击了文件上传')" accept=".docx">

      <div v-if="fileName" class="status-bar">
        ✅ 已读取文件: <b>{{ fileName }}</b><br>
        大小: {{ fileSize }} 字节
      </div>
      <div v-if="uploadError" class="status-bar error-bar">
        ❌ 读取失败: {{ uploadError }}
      </div>
    </div>

    <div class="box">
      <h3>2. 确认数据</h3>
      <textarea v-model="jsonData"></textarea>
    </div>

    <div class="box">
      <button @click="generate" :disabled="!fileBuffer">生成并下载 (使用 ■)</button>
      <p v-if="status" style="color: blue; white-space: pre-line; margin-top: 10px;">{{ status }}</p>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue

    const fullData = {
      "p_name": "张三",
      "p_phone": "13800138000",
      "p_gender_m": true,
      "p_gender_f": false,
      "p_id_num": "110101199001011234",
      "pc_type_llc": true,
      "contract_no_issue": true,
      "d_id_num": "120101198510011234",
      "d_phone": "13800000000",
      "claim_content": "请求判令被告...\n这是第二行"
    };

    createApp({
      setup() {
        const fileBuffer = ref(null)
        const fileName = ref('')
        const fileSize = ref(0)
        const jsonData = ref(JSON.stringify(fullData, null, 4))
        const status = ref('')
        const uploadError = ref('')

        /**
         * 处理文件上传事件
         * @param {Event} e - 文件输入框的 change 事件
         * 功能：读取用户选择的 .docx 文件，转换为 ArrayBuffer 格式存储
         */
        const handleFile = (e) => {
          try {
            console.log("文件改变事件触发");
            const file = e.target.files[0]
            if (!file) return

            // 保存文件基本信息
            fileName.value = file.name
            fileSize.value = file.size
            uploadError.value = ''

            // 使用 FileReader 读取文件为二进制数据
            const reader = new FileReader()
            reader.onload = (e) => {
              console.log("文件读取完成");
              fileBuffer.value = e.target.result  // 存储文件的 ArrayBuffer
            }
            reader.onerror = (e) => {
              console.error("文件读取错误", e);
              uploadError.value = "文件读取被浏览器拦截，请确保是本地打开的 HTML 文件，而不是在聊天预览中。";
            }
            reader.readAsArrayBuffer(file)  // 以 ArrayBuffer 格式读取
          } catch (err) {
            uploadError.value = err.message;
            alert("发生错误: " + err.message);
          }
        }

        /**
         * 兼容性节点查找函数
         * @param {Element} parent - 父节点
         * @param {string} tagName - 要查找的标签名（不含命名空间前缀）
         * @returns {HTMLCollection} 找到的节点列表
         * 功能：在 Word XML 中查找节点，兼容带命名空间和不带命名空间的情况
         */
        const getNodes = (parent, tagName) => {
          // 先尝试查找带 w: 命名空间的标签
          let list = parent.getElementsByTagName('w:' + tagName)
          // 如果没找到，尝试不带命名空间的标签
          if (list.length === 0) list = parent.getElementsByTagName(tagName)
          return list
        }

        /**
         * 生成填充后的 Word 文档
         * 功能：解析模板文件，根据 JSON 数据替换占位符，生成新文档并下载
         */
        const generate = () => {
          try {
            status.value = "正在处理..."
            // 解析用户输入的 JSON 数据
            const data = JSON.parse(jsonData.value)

            // 检查 PizZip 库是否加载成功
            if (!PizZip) throw new Error("PizZip 库未加载，请检查网络")

            // 1. 解压 docx 文件（docx 本质是 zip 压缩包）
            const zip = new PizZip(fileBuffer.value)
            
            // 2. 提取 word/document.xml（Word 文档的主要内容）
            const docXml = zip.file("word/document.xml").asText()
            // console.log(docXml)

            // 3. 解析 XML 文档
            const parser = new DOMParser()
            const xmlDoc = parser.parseFromString(docXml, "application/xml")
            // console.log(xmlDoc)
            // 4. 查找所有内容控件（sdt = Structured Document Tag）
            const sdts = getNodes(xmlDoc, "sdt")
            // console.log(sdts)
            // 如果没有找到控件，说明模板格式不对
            if (sdts.length === 0) {
              status.value = "⚠️ 错误：文档里没找到控件！\n请确保您上传的是 Python 脚本生成的 ready_template.docx"
              return
            }

            // 5. 遍历所有控件，填充数据
            let count = 0
            for (let i = 0; i < sdts.length; i++) {
              const sdt = sdts[i]
              
              // 获取控件的标签（tag），标签的 w:val 属性存储了字段名
              const tagNode = getNodes(sdt, "tag")[0]
              if (!tagNode) continue

              // 获取字段名（如 "p_name", "p_phone" 等）
              const key = tagNode.getAttribute("w:val")
              if (data[key] === undefined) continue  // 如果 JSON 中没有这个字段，跳过

              count++
              const val = data[key]
              
              // 获取控件的内容区域
              const content = getNodes(sdt, "sdtContent")[0]
              if (content) {
                // 获取所有文本节点（t = text）
                const tNodes = getNodes(content, "t")
                if (tNodes.length > 0) {
                  // 根据数据类型填充内容
                  if (typeof val === 'boolean') {
                    // 布尔值：true 显示 ■（选中），false 显示 □（未选中）
                    tNodes[0].textContent = val ? '■' : '□'
                  } else {
                    // 其他类型：转为字符串填充
                    tNodes[0].textContent = String(val)
                  }
                  // 清空其他多余的文本节点
                  for (let j = 1; j < tNodes.length; j++) {
                    tNodes[j].textContent = ""
                  }
                }
              }
            }

            // 6. 将修改后的 XML 序列化回字符串
            const serializer = new XMLSerializer()
            const newXml = serializer.serializeToString(xmlDoc)
            
            // 7. 替换 zip 中的 document.xml
            zip.file("word/document.xml", newXml)

            // 8. 生成新的 docx 文件（Blob 格式）
            const blob = zip.generate({
              type: "blob",
              mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            })
            
            // 9. 触发浏览器下载
            saveAs(blob, "修复版_结果.docx")
            
            // 显示成功信息
            status.value = `✅ 成功！已填充 ${count} 个字段。\n(选中项已显示为黑框 ■)`
          } catch (e) {
            console.error(e)
            status.value = "❌ 出错：" + e.message
            alert("生成出错: " + e.message)
          }
        }

        return { fileBuffer, fileName, fileSize, jsonData, generate, status, handleFile, uploadError }
      }
    }).mount('#app')
  </script>
</body>

</html>
